<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 3D Memory Box</title>
  <link rel="stylesheet" href="/components/style.css">
  <link rel="stylesheet" href="/components/shared.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">✦</span> 3D Memory Box
    </div>
    <h2>다시 만나 반가워요</h2>
    <p class="auth-lead">공간 데이터를 더 선명하게 살펴보세요.</p>

    <div id="notice" aria-live="polite"></div>

    <form action="/login" method="post">
      <div class="form-group">
        <label for="userId">아이디</label>
        <input id="userId" name="userId" type="text" autocomplete="username" placeholder="아이디를 입력하세요" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <button id="btn-login" class="primary-button" type="submit">로그인</button>
    </form>
    <a class="sso-button" href="/festivals">로그인 없이 축제 지도 둘러보기</a>
    <a class="sso-button" href="/oauth2/authorization/oidc">외부 계정으로 로그인</a>

    <p id="link-register" class="auth-footer">처음 방문하셨나요? <a href="/register">계정 만들기</a></p>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const noticeContainer = document.getElementById('notice');

      if (!noticeContainer) return;

      if (params.has('ssoError')) {
        noticeContainer.textContent = '';
        const message = document.createElement('p');
        message.className = 'notice error';
        message.textContent = '외부 로그인에 실패했습니다. 계정 상태 또는 SSO 설정을 확인해 주세요.';
        noticeContainer.append(message);
      } else if (params.has('error')) {
        noticeContainer.innerHTML = '<p class="notice error">아이디 또는 비밀번호를 다시 확인해 주세요.</p>';
      } else if (params.has('registered')) {
        noticeContainer.innerHTML = '<p class="notice success">계정이 생성되었습니다. 로그인해 주세요.</p>';
      }
    });
  </script>
</body>
</html>
