<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 3D Memory Box</title>
  <link rel="stylesheet" href="/src/components/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">✦</span> 3D Memory Box
    </div>
    <h1>새 계정 만들기</h1>
    <p class="auth-lead">필요한 정보만 입력하면 바로 시작할 수 있어요.</p>

    <div id="notice" aria-live="polite"></div>

    <form action="/register" method="post">
      <div class="form-group">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="이름을 입력하세요" required autofocus>
      </div>
      <div class="form-group">
        <label for="userId">아이디</label>
        <input id="userId" name="userId" type="text" autocomplete="username" placeholder="영문, 숫자 조합" minlength="3" maxlength="40" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="8자 이상 입력하세요" minlength="8" required>
      </div>
      <button id="btn-register" class="primary-button" type="submit">계정 만들기</button>
    </form>

    <p id="link-login" class="auth-footer">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const noticeContainer = document.getElementById('notice');

      if (params.has('error') && noticeContainer) {
        noticeContainer.innerHTML = '<p class="notice error">이미 사용 중인 아이디/이메일입니다.</p>';
      }
    });
  </script>
</body>
</html>
