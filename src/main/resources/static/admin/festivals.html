<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>축제 데이터 적재 | 관리자</title>
  <link rel="stylesheet" href="/admin/festivals.css">
</head>
<body>
  <main class="import-page">
    <header class="import-header">
      <a href="/admin" class="back-link">← 관리자 콘솔</a>
      <span class="admin-label">ADMINISTRATION</span>
      <h1>축제 데이터 적재</h1>
      <p>전국문화축제 표준데이터 CSV를 등록하고 적재 결과를 확인합니다.</p>
    </header>
    <section class="import-card">
      <h2>CSV 파일 업로드</h2>
      <p class="card-description">최대 5MB · CSV 파일만 가능 · 기존 축제는 중복 없이 갱신됩니다.</p>
      <form id="import-form">
        <label class="file-picker" for="csv-file">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <strong id="file-name">CSV 파일을 선택하세요</strong>
          <small>전국문화축제표준데이터 · .csv</small>
          <input id="csv-file" name="file" type="file" accept=".csv,text/csv" required>
        </label>
        <label class="encoding-label" for="encoding">파일 인코딩
          <select id="encoding" name="encoding">
            <option value="MS949">MS949 (기본)</option>
            <option value="UTF-8">UTF-8</option>
          </select>
        </label>
        <button id="import-button" class="import-button" type="submit">업로드 및 적재</button>
      </form>
      <p id="import-message" class="import-message" role="status" aria-live="polite"></p>
      <section id="import-result" class="import-result" hidden aria-label="적재 결과"></section>
    </section>
    <section class="history-card">
      <div class="history-heading">
        <div><span class="admin-label">RECENT ACTIVITY</span><h2>최근 적재 이력</h2></div>
        <button id="refresh-history" class="refresh-button" type="button">새로고침</button>
      </div>
      <p id="history-message" class="history-message" role="status"></p>
      <div class="history-scroll">
        <table>
          <thead><tr><th>파일명</th><th>전체</th><th>성공</th><th>건너뜀</th><th>적재 시각</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/admin/festivals.js"></script>
</body>
</html>
